<p>Google Health Bridge は、開発者本人が自分の睡眠と疲労回復を記録・分析するために個人で運用している小さな連携サービスです。一般には公開しておらず、利用者は開発者本人だけです。</p>

<li>本人の Google Health アカウントから、睡眠、心拍変動（HRV）、安静時心拍数、呼吸数、血中酸素飽和度（SpO2）のデータを読み取ります。</li>
<li>読み取ったデータは、本人の睡眠記録と回復度合いの把握のためだけに使います。</li>
